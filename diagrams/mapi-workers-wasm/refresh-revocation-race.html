      <figcaption>
        <p><strong>Before mint and before release.</strong> The first Durable Object transaction checks the open fence and records an attempt under its current epoch. After the mint commits, the final transaction checks the same attempt ID and authorizes release only if the session is still open at that epoch. A MaPi revocation closes the fence, advances the epoch, and saves the cleanup job in one SQLite transaction. The regular refresh path also checks current Kratos session status.</p>
        <p><strong>Hydra can commit after the fence closes.</strong> The Hydra port must buffer the token response and record the mint outcome in the same Postgres transaction as rotation. A stale final check rejects the response with <code>invalid_grant</code>. If the final check wins first, the response can still reach the client, and later live checks reject the revoked session.</p>
        <p><strong>Cleanup survives failures.</strong> The alarm reloads the durable job and schedules the next attempt with backoff while the job is pending. Job recovery must also restore any missing retry schedule. A missing receipt stays pending until Hydra/Postgres proves the mint committed or was durably prevented from committing. The job stays pending until every old-epoch attempt is settled and the final scoped grant revocation succeeds. Use the same job and grant IDs on retry.</p>
        <p>This is a proposed Hydra port protocol for revocation routed through MaPi. Out-of-band Kratos revocations enter the cleanup path when a live check observes them.</p>
      </figcaption>
