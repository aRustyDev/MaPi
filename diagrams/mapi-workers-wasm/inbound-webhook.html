<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaPi · Inbound webhook</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5;
      --white: #ffffff;
      --ink: #2d3142;
      --muted: #4f5d75;
      --rule: #bfc0c0;
      --subtle: #dde0e5;
      --public-zone: #eeeef0;
      --private-zone: #eef0f3;
      --backend-zone: #efeff0;
      --accent: #eb6c36;
      --accent-dark: #853b20;
      --accent-tint: #fceee7;
      --link: #2e5aa8;
      --sans: "Geist", system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, monospace;
      --serif: "Instrument Serif", Georgia, serif;
    }
    body { margin: 0; padding: 28px 24px; color: var(--ink); background: var(--paper); font-family: var(--sans); }
    main { width: 100%; max-width: 1328px; margin: auto; }
    header { padding: 0 20px 18px; border-bottom: 1px solid var(--rule); }
    .kicker { margin: 0 0 8px; color: var(--muted); font: 500 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0 0 6px; font: 400 42px/1.05 var(--serif); }
    header > .page-deck { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    figure { margin: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; height: auto; }
    svg text { fill: var(--ink); font-family: var(--sans); dominant-baseline: auto; }
    .zone { stroke: var(--muted); stroke-width: 1; stroke-opacity: .45; stroke-dasharray: 4 4; }
    .zone-name { font: 600 14px var(--sans); }
    .box { fill: var(--white); stroke: var(--rule); stroke-width: 1; }
    .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .optional { stroke: var(--muted); stroke-dasharray: 5 4; }
    .name { font-weight: 600; font-size: 16px; }
    .entry { font-weight: 600; font-size: 14px; }
    .detail { fill: var(--muted); font: 400 11px var(--sans); }
    .tech { fill: var(--muted); font: 400 9px var(--mono); }
    .tag { fill: var(--muted); font: 600 9px var(--mono); letter-spacing: .075em; }
    .tag-accent { fill: var(--accent-dark); }
    .tag-bg { fill: #e9ecf1; }
    .tag-accent-bg { fill: #f9d8c6; }
    .row { fill: #fffaf7; stroke: #e5c6b7; stroke-width: 1; }
    .artifact { fill: #f2f4f7; stroke: var(--subtle); stroke-width: 1; }
    .code { fill: var(--ink); font: 600 10px var(--mono); }
    .key { fill: #ffffff; stroke: var(--rule); stroke-width: 1; }
    .rule { stroke: var(--subtle); stroke-width: 1; }
    .flow { fill: none; stroke: var(--link); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .internal { stroke: var(--muted); }
    .dashed { stroke-dasharray: 5 4; }
    .arrow-label { fill: var(--link); font: 500 9px var(--mono); letter-spacing: .025em; }
    .arrow-label.internal-label { fill: var(--muted); }
    .label-bg { fill: var(--paper); }
    .note { fill: var(--muted); font: 400 10px var(--sans); }
    .legend-label { font-weight: 600; font-size: 14px; }
    figcaption { margin: 0 20px; padding: 12px 0 8px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; line-height: 1.55; }
    figcaption p { max-width: 78ch; margin: 0 0 6px; }
    .detail-panel { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--rule); }
    .detail-panel > h2 { margin: 0 20px 4px; font: 400 32px/1.1 var(--serif); }
    .detail-panel > p { margin: 0 20px 12px; color: var(--muted); font-size: 14px; }
    .binding-notes { margin: 16px 20px 0; max-width: 1056px; border-top: 1px solid var(--rule); }
    .binding-notes > div { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--subtle); }
    .binding-notes dt { font-size: 13px; font-weight: 600; }
    .binding-notes dd { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .binding-notes code { font: .94em var(--mono); }
    .page-nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 12px; }
    .page-nav a { color: var(--link); text-underline-offset: 3px; }
    .request-figure { padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--subtle); }
    .request-figure h3 { margin: 0 20px 7px; font-size: 18px; line-height: 1.3; font-weight: 600; }
    .request-figure figcaption { border-top: 0; padding-top: 4px; }
    .request-figure figcaption p { max-width: 100ch; }
    .seq-fragment { fill: #eef0f3; stroke: var(--rule); stroke-width: 1; }
    .seq-tab { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
    .seq-guard { fill: var(--muted); font: 600 10px var(--mono); }
    .seq-lifeline, .seq-dispatch-divider { fill: none; stroke: #98a2b1; stroke-width: 1; stroke-dasharray: 3 4; }
    .seq-active { fill: #e2e7ee; stroke: #8190a4; stroke-width: 1; }
    .seq-arrow { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .seq-return, .seq-async { stroke-dasharray: 5 4; }
    .seq-ok { stroke: #b24a21; }
    .seq-message { fill: var(--ink); font: 500 10px var(--mono); }
    .seq-message-ok { fill: var(--accent-dark); }
    .request-mode { margin: 0 20px 6px; color: var(--muted); font: 500 11px var(--mono); }
    .request-nav { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 20px 16px; font-size: 12px; }
    .request-nav a { color: var(--link); text-underline-offset: 3px; }
    .state-summary { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--subtle); }
    .state-summary h3 { margin: 0 20px; font-size: 18px; }
    .journey-note { margin: 12px 20px 0; max-width: 100ch; color: var(--muted); font-size: 12px; line-height: 1.55; }
    @media (max-width: 600px) {
      .detail-panel > h2, .detail-panel > p, .binding-notes { margin-left: 8px; margin-right: 8px; }
      .binding-notes > div { grid-template-columns: 1fr; gap: 3px; }
      .request-figure h3, .journey-note, .request-nav, .request-mode, .state-summary h3 { margin-left: 8px; margin-right: 8px; }
    }
    @media (max-width: 600px) { body { padding: 20px 12px; } header { padding-left: 8px; } figcaption { margin: 0 8px; } }
    @media print {
      @page { size: landscape; margin: 10mm; }
      body { padding: 0; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .diagram-container { overflow: visible; }
      svg { min-width: 0; }
      figure { break-inside: avoid; }
      .page-nav, .request-nav { display: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <p class="kicker">Request sequence · target deployment</p>
    <h1 id="diagram-heading">Inbound webhook</h1>
    <nav class="page-nav" aria-label="MaPi deployment diagrams">

    </nav>
  </header>
    <figure class="request-figure" id="mapi-flow-webhook">
      <p class="request-mode">IAP off and on · same path</p>
      <div class="diagram-container" tabindex="0" aria-label="Inbound webhook sequence">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="mapi-flow-webhook-title mapi-flow-webhook-desc">
        <title id="mapi-flow-webhook-title">Inbound webhook</title>
        <desc id="mapi-flow-webhook-desc">The public Worker verifies the provider signature, authorizes the integration and event, and enqueues the webhook for idempotent processing by a private consumer in either IAP mode.</desc>
        <defs>
        <marker id="mapi-flow-webhook-call" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
        <marker id="mapi-flow-webhook-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#b24a21"/></marker>
        <marker id="mapi-flow-webhook-async" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="1280" height="430" fill="#f5f5f5"/>
        <path class="seq-lifeline" d="M124 68V418"/>
        <path class="seq-lifeline" d="M380 68V418"/>
        <path class="seq-lifeline" d="M636 68V418"/>
        <path class="seq-lifeline" d="M892 68V418"/>
        <path class="seq-lifeline" d="M1148 68V418"/>
        <rect class="seq-active" x="376" y="112" width="8" height="168" rx="1"/>
        <rect class="seq-active" x="888" y="304" width="8" height="104" rx="1"/>
        <path class="seq-arrow seq-call" d="M124 112H380" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="149.2" y="91" width="205.6" height="15" rx="0"/>
        <text class="seq-message" x="252" y="102" text-anchor="middle">Signed raw payload + delivery ID</text>
        <path class="seq-arrow seq-call" d="M380 134H402Q408 134 408 140V148Q408 154 402 154H380" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="415" y="137" width="217" height="15" rx="0"/>
        <text class="seq-message" x="420" y="148">Verify signature and freshness</text>
        <path class="seq-arrow seq-call" d="M380 166H402Q408 166 408 172V180Q408 186 402 186H380" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="415" y="169" width="217" height="15" rx="0"/>
        <text class="seq-message" x="420" y="180">Allow configured tenant and event</text>
        <path class="seq-arrow seq-call" d="M380 208H636" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="435.4" y="187" width="145.1" height="15" rx="0"/>
        <text class="seq-message" x="508" y="198" text-anchor="middle">Enqueue verified event</text>
        <path class="seq-arrow seq-return" d="M636 240H380" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="441.5" y="219" width="133.0" height="15" rx="0"/>
        <text class="seq-message" x="508" y="230" text-anchor="middle">Enqueue acknowledged</text>
        <path class="seq-arrow seq-ok" d="M380 272H124" marker-end="url(#mapi-flow-webhook-ok)"/>
        <rect class="label-bg" x="164.3" y="251" width="175.3" height="15" rx="0"/>
        <text class="seq-message seq-message-ok" x="252" y="262" text-anchor="middle">2xx provider acknowledgment</text>
        <path class="seq-arrow seq-async" d="M636 304H892" marker-end="url(#mapi-flow-webhook-async)"/>
        <rect class="label-bg" x="718.7" y="283" width="90.6" height="15" rx="0"/>
        <text class="seq-message" x="764" y="294" text-anchor="middle">Deliver event</text>
        <path class="seq-arrow seq-call" d="M892 326H914Q920 326 920 332V340Q920 346 914 346H892" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="927" y="329" width="217" height="15" rx="0"/>
        <text class="seq-message" x="932" y="340">Deduplicate by integration + ID</text>
        <path class="seq-arrow seq-call" d="M892 368H1148" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="926.3" y="347" width="187.4" height="15" rx="0"/>
        <text class="seq-message" x="1020" y="358" text-anchor="middle">Apply scoped action and audit</text>
        <path class="seq-arrow seq-return" d="M892 400H636" marker-end="url(#mapi-flow-webhook-call)"/>
        <rect class="label-bg" x="676.3" y="379" width="175.3" height="15" rx="0"/>
        <text class="seq-message" x="764" y="390" text-anchor="middle">Acknowledge processed event</text>
        <rect class="box" x="20" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="124" y="38" text-anchor="middle">External provider</text>
        <text class="detail" x="124" y="56" text-anchor="middle">Webhook sender</text>
        <rect class="box" x="276" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="380" y="38" text-anchor="middle">MaPi ingress</text>
        <text class="detail" x="380" y="56" text-anchor="middle">Public Worker</text>
        <rect class="box" x="532" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="636" y="38" text-anchor="middle">Cloudflare Queues</text>
        <text class="detail" x="636" y="56" text-anchor="middle">Durable delivery</text>
        <rect class="box" x="788" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="892" y="38" text-anchor="middle">MaPi consumer</text>
        <text class="detail" x="892" y="56" text-anchor="middle">Private Worker</text>
        <rect class="box" x="1044" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="1148" y="38" text-anchor="middle">Tenant service</text>
        <text class="detail" x="1148" y="56" text-anchor="middle">Scoped operation and audit</text>
        </svg>
      </div>
      <figcaption>
        <p>Timestamp or replay checks follow the provider’s signing contract. The consumer uses a scoped service identity and processes redeliveries idempotently.</p>
      </figcaption>
    </figure>
</main>
</body>
