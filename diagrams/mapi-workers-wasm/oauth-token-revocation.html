<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaPi · OAuth token revocation</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5;
      --white: #ffffff;
      --ink: #2d3142;
      --muted: #4f5d75;
      --rule: #bfc0c0;
      --subtle: #dde0e5;
      --public-zone: #eeeef0;
      --private-zone: #eef0f3;
      --backend-zone: #efeff0;
      --accent: #eb6c36;
      --accent-dark: #853b20;
      --accent-tint: #fceee7;
      --link: #2e5aa8;
      --sans: "Geist", system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, monospace;
      --serif: "Instrument Serif", Georgia, serif;
    }
    body { margin: 0; padding: 28px 24px; color: var(--ink); background: var(--paper); font-family: var(--sans); }
    main { width: 100%; max-width: 1328px; margin: auto; }
    header { padding: 0 20px 18px; border-bottom: 1px solid var(--rule); }
    .kicker { margin: 0 0 8px; color: var(--muted); font: 500 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0 0 6px; font: 400 42px/1.05 var(--serif); }
    header > .page-deck { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    figure { margin: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; height: auto; }
    svg text { fill: var(--ink); font-family: var(--sans); dominant-baseline: auto; }
    .zone { stroke: var(--muted); stroke-width: 1; stroke-opacity: .45; stroke-dasharray: 4 4; }
    .zone-name { font: 600 14px var(--sans); }
    .box { fill: var(--white); stroke: var(--rule); stroke-width: 1; }
    .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .optional { stroke: var(--muted); stroke-dasharray: 5 4; }
    .name { font-weight: 600; font-size: 16px; }
    .entry { font-weight: 600; font-size: 14px; }
    .detail { fill: var(--muted); font: 400 11px var(--sans); }
    .tech { fill: var(--muted); font: 400 9px var(--mono); }
    .tag { fill: var(--muted); font: 600 9px var(--mono); letter-spacing: .075em; }
    .tag-accent { fill: var(--accent-dark); }
    .tag-bg { fill: #e9ecf1; }
    .tag-accent-bg { fill: #f9d8c6; }
    .row { fill: #fffaf7; stroke: #e5c6b7; stroke-width: 1; }
    .artifact { fill: #f2f4f7; stroke: var(--subtle); stroke-width: 1; }
    .code { fill: var(--ink); font: 600 10px var(--mono); }
    .key { fill: #ffffff; stroke: var(--rule); stroke-width: 1; }
    .rule { stroke: var(--subtle); stroke-width: 1; }
    .flow { fill: none; stroke: var(--link); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .internal { stroke: var(--muted); }
    .dashed { stroke-dasharray: 5 4; }
    .arrow-label { fill: var(--link); font: 500 9px var(--mono); letter-spacing: .025em; }
    .arrow-label.internal-label { fill: var(--muted); }
    .label-bg { fill: var(--paper); }
    .note { fill: var(--muted); font: 400 10px var(--sans); }
    .legend-label { font-weight: 600; font-size: 14px; }
    figcaption { margin: 0 20px; padding: 12px 0 8px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; line-height: 1.55; }
    figcaption p { max-width: 78ch; margin: 0 0 6px; }
    .detail-panel { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--rule); }
    .detail-panel > h2 { margin: 0 20px 4px; font: 400 32px/1.1 var(--serif); }
    .detail-panel > p { margin: 0 20px 12px; color: var(--muted); font-size: 14px; }
    .binding-notes { margin: 16px 20px 0; max-width: 1056px; border-top: 1px solid var(--rule); }
    .binding-notes > div { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--subtle); }
    .binding-notes dt { font-size: 13px; font-weight: 600; }
    .binding-notes dd { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .binding-notes code { font: .94em var(--mono); }
    .page-nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 12px; }
    .page-nav a { color: var(--link); text-underline-offset: 3px; }
    .request-figure { padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--subtle); }
    .request-figure h3 { margin: 0 20px 7px; font-size: 18px; line-height: 1.3; font-weight: 600; }
    .request-figure figcaption { border-top: 0; padding-top: 4px; }
    .request-figure figcaption p { max-width: 100ch; }
    .seq-fragment { fill: #eef0f3; stroke: var(--rule); stroke-width: 1; }
    .seq-tab { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
    .seq-guard { fill: var(--muted); font: 600 10px var(--mono); }
    .seq-lifeline, .seq-dispatch-divider { fill: none; stroke: #98a2b1; stroke-width: 1; stroke-dasharray: 3 4; }
    .seq-active { fill: #e2e7ee; stroke: #8190a4; stroke-width: 1; }
    .seq-arrow { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .seq-return, .seq-async { stroke-dasharray: 5 4; }
    .seq-ok { stroke: #b24a21; }
    .seq-message { fill: var(--ink); font: 500 10px var(--mono); }
    .seq-message-ok { fill: var(--accent-dark); }
    .request-mode { margin: 0 20px 6px; color: var(--muted); font: 500 11px var(--mono); }
    .request-nav { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 20px 16px; font-size: 12px; }
    .request-nav a { color: var(--link); text-underline-offset: 3px; }
    .state-summary { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--subtle); }
    .state-summary h3 { margin: 0 20px; font-size: 18px; }
    .journey-note { margin: 12px 20px 0; max-width: 100ch; color: var(--muted); font-size: 12px; line-height: 1.55; }
    @media (max-width: 600px) {
      .detail-panel > h2, .detail-panel > p, .binding-notes { margin-left: 8px; margin-right: 8px; }
      .binding-notes > div { grid-template-columns: 1fr; gap: 3px; }
      .request-figure h3, .journey-note, .request-nav, .request-mode, .state-summary h3 { margin-left: 8px; margin-right: 8px; }
    }
    @media (max-width: 600px) { body { padding: 20px 12px; } header { padding-left: 8px; } figcaption { margin: 0 8px; } }
    @media print {
      @page { size: landscape; margin: 10mm; }
      body { padding: 0; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .diagram-container { overflow: visible; }
      svg { min-width: 0; }
      figure { break-inside: avoid; }
      .page-nav, .request-nav { display: none; }
    }
  </style>
</head>

<main>
  <header>

    <figure class="request-figure" id="mapi-flow-oauth-revoke">
      <p class="request-mode">IAP off and on · same path</p>
      <div class="diagram-container" tabindex="0" aria-label="OAuth token revocation sequence">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 302" role="img" aria-labelledby="mapi-flow-oauth-revoke-title mapi-flow-oauth-revoke-desc">
        <title id="mapi-flow-oauth-revoke-title">OAuth token revocation</title>
        <desc id="mapi-flow-oauth-revoke-desc">The OAuth client revokes a token through Hydra; Hydra applies its token cascade rules and updates its OAuth store independently of the Kratos browser session.</desc>
        <defs>
        <marker id="mapi-flow-oauth-revoke-call" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
        <marker id="mapi-flow-oauth-revoke-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#b24a21"/></marker>
        <marker id="mapi-flow-oauth-revoke-async" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="1280" height="302" fill="#f5f5f5"/>
        <path class="seq-lifeline" d="M148 68V290"/>
        <path class="seq-lifeline" d="M640 68V290"/>
        <path class="seq-lifeline" d="M1132 68V290"/>
        <rect class="seq-active" x="1128" y="144" width="8" height="104" rx="1"/>
        <path class="seq-arrow seq-call" d="M148 112H640" marker-end="url(#mapi-flow-oauth-revoke-call)"/>
        <rect class="label-bg" x="306.3" y="91" width="175.3" height="15" rx="0"/>
        <text class="seq-message" x="394" y="102" text-anchor="middle">POST /oauth2/revoke · token</text>
        <path class="seq-arrow seq-call" d="M640 144H1132" marker-end="url(#mapi-flow-oauth-revoke-call)"/>
        <rect class="label-bg" x="792.3" y="123" width="187.4" height="15" rx="0"/>
        <text class="seq-message" x="886" y="134" text-anchor="middle">Forward client auth and token</text>
        <path class="seq-arrow seq-call" d="M1132 166H1110Q1104 166 1104 172V180Q1104 186 1110 186H1132" marker-end="url(#mapi-flow-oauth-revoke-call)"/>
        <rect class="label-bg" x="880" y="169" width="217" height="15" rx="0"/>
        <text class="seq-message" x="885" y="180">Authenticate client; check owner</text>
        <path class="seq-arrow seq-call" d="M1132 198H1110Q1104 198 1104 204V212Q1104 218 1110 218H1132" marker-end="url(#mapi-flow-oauth-revoke-call)"/>
        <rect class="label-bg" x="880" y="201" width="217" height="15" rx="0"/>
        <text class="seq-message" x="885" y="212">Store revocation; apply cascade</text>
        <path class="seq-arrow seq-return" d="M1132 240H640" marker-end="url(#mapi-flow-oauth-revoke-call)"/>
        <rect class="label-bg" x="783.2" y="219" width="205.6" height="15" rx="0"/>
        <text class="seq-message" x="886" y="230" text-anchor="middle">200 for revoked or unknown token</text>
        <path class="seq-arrow seq-ok" d="M640 272H148" marker-end="url(#mapi-flow-oauth-revoke-ok)"/>
        <rect class="label-bg" x="324.5" y="251" width="139.1" height="15" rx="0"/>
        <text class="seq-message seq-message-ok" x="394" y="262" text-anchor="middle">Return OAuth response</text>
        <rect class="box" x="44" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="148" y="38" text-anchor="middle">OAuth client</text>
        <text class="detail" x="148" y="56" text-anchor="middle">Relying party or token client</text>
        <rect class="box" x="536" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="640" y="38" text-anchor="middle">MaPi ingress</text>
        <text class="detail" x="640" y="56" text-anchor="middle">Public Worker</text>
        <rect class="box" x="1028" y="16" width="208" height="52" rx="0"/>
        <text class="name" x="1132" y="38" text-anchor="middle">Hydra</text>
        <text class="detail" x="1132" y="56" text-anchor="middle">OAuth2 / OIDC Worker</text>
        </svg>
      </div>
      <figcaption>
        <p>OAuth token revocation updates Hydra’s OAuth store. Kratos keeps its browser session lifecycle. Hydra documents invalidation of the access token created with a revoked refresh token. Wider chain behavior follows the selected Hydra pin and rotation policy.</p>
      </figcaption>
    </figure>
</main>
